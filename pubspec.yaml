name: neatink
description: "NeatInk: handwriting notes for Android tablets. Offline, local, tidy as you write."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # State management (MIT).
  flutter_riverpod: ^3.4.3
  # Pressure-sensitive stroke outlines (MIT).
  perfect_freehand: ^2.5.2+1
  # PDFium-based PDF rendering + text extraction (MIT).
  pdfrx: ^2.10.1
  # Import PDFs/images and save exported PDFs via the system picker (MIT).
  file_picker: ^13.2.0
  # App documents directory (BSD-3).
  path_provider: ^2.1.6
  path: ^1.9.1
  # Stroke/page/notebook ids (MIT).
  uuid: ^4.6.0
  # Settings and tool preferences (BSD-3).
  shared_preferences: ^2.5.6
  # PIN hashing for the app lock (BSD-3).
  crypto: ^3.0.7
  # Share exported PDFs (BSD-3).
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
