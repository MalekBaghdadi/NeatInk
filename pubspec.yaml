name: neatink
description: "NeatInk: handwriting notes for Android tablets. Offline, local, handwriting to typed text."
publish_to: 'none'

version: 1.6.0+8

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # State management (MIT).
  flutter_riverpod: ^3.4.3
  # Pressure-sensitive stroke outlines (MIT).
  perfect_freehand: ^2.5.2+1
  # PDFium-based PDF rendering + text extraction (MIT).
  pdfrx: ^2.10.1
  # Import PDFs/images and save exported PDFs via the system picker (MIT).
  file_picker: ^13.2.0
  # App documents directory (BSD-3).
  path_provider: ^2.1.6
  path: ^1.9.1
  # Stroke/page/notebook ids (MIT).
  uuid: ^4.6.0
  # Settings and tool preferences (BSD-3).
  shared_preferences: ^2.5.6
  # PIN hashing for the app lock (BSD-3).
  crypto: ^3.0.7
  # Share exported PDFs (BSD-3).
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Bundled text-box fonts (static TTFs, SIL OFL; see assets/fonts/*/OFL.txt).
  # Keep in sync with lib/document/font_kind.dart.
  fonts:
    - family: NI-Roboto
      fonts:
        - asset: assets/fonts/Roboto/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto/Roboto-Italic.ttf
          style: italic
        - asset: assets/fonts/Roboto/Roboto-BoldItalic.ttf
          weight: 700
          style: italic
    - family: NI-OpenSans
      fonts:
        - asset: assets/fonts/OpenSans/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans/OpenSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/OpenSans/OpenSans-Italic.ttf
          style: italic
        - asset: assets/fonts/OpenSans/OpenSans-BoldItalic.ttf
          weight: 700
          style: italic
    - family: NI-Lato
      fonts:
        - asset: assets/fonts/Lato/Lato-Regular.ttf
        - asset: assets/fonts/Lato/Lato-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lato/Lato-Italic.ttf
          style: italic
        - asset: assets/fonts/Lato/Lato-BoldItalic.ttf
          weight: 700
          style: italic
    - family: NI-Nunito
      fonts:
