    - family: NI-DancingScript
      fonts:
        - asset: assets/fonts/DancingScript/DancingScript-Regular.ttf
        - asset: assets/fonts/DancingScript/DancingScript-Bold.ttf
          weight: 700
  # Handwriting recognition: ONNX model, charset and word frequencies.
  assets:
    - assets/htr/model.onnx
    - assets/htr/charset.json
    - assets/htr/word_freq.txt
    - assets/htr/subject_words.txt
    - assets/fonts/Roboto/OFL.txt
    - assets/fonts/OpenSans/OFL.txt
    - assets/fonts/Lato/OFL.txt
    - assets/fonts/Nunito/OFL.txt
    - assets/fonts/Arimo/OFL.txt
    - assets/fonts/Tinos/OFL.txt
    - assets/fonts/Merriweather/OFL.txt
