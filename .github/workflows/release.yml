name: Release APK

# Builds the signed APKs and publishes them as a GitHub Release when a
# version tag (v1.0.0, v1.0.1, ...) is pushed.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Restore the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mariam-notes.jks"
          {
            echo "storePassword=$KEY_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=mariamnotes"
            echo "storeFile=$RUNNER_TEMP/mariam-notes.jks"
          } > android/key.properties
          # Fail here, with a clear message, if the secrets don't open the key.
          keytool -list -keystore "$RUNNER_TEMP/mariam-notes.jks" \
            -storepass "$KEY_PASSWORD" -alias mariamnotes > /dev/null \
            || { echo "::error::KEYSTORE_BASE64 / KEY_PASSWORD do not open the signing key"; exit 1; }

      - run: flutter pub get
      - run: flutter analyze

      - name: Build APKs
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Collect release files
        run: |
          mkdir dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/MariamsNotes.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/MariamsNotes-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/MariamsNotes-armeabi-v7a.apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --title "Mariam's Notes ${GITHUB_REF_NAME#v}" \
            --generate-notes
