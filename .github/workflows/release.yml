name: Release APK

# Builds the signed APKs and publishes them as a GitHub Release when a
# version tag (v1.0.0, v1.0.1, ...) is pushed, or when started by hand
# ("Run workflow" with a version): then it builds the chosen branch and
# creates the tag together with the release (for when a tag can't be
# pushed, e.g. from a cloud session).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to create, e.g. v1.4.0 (must match pubspec.yaml)'
        required: true

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::$TAG is not a version tag like v1.4.0"; exit 1; }
          grep -q "^version: ${TAG#v}+" pubspec.yaml \
            || { echo "::error::pubspec.yaml is not version ${TAG#v}"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Restore the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mariam-notes.jks"
          {
            echo "storePassword=$KEY_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=mariamnotes"
            echo "storeFile=$RUNNER_TEMP/mariam-notes.jks"
          } > android/key.properties
          # Fail here, with a clear message, if the secrets don't open the key.
          keytool -list -keystore "$RUNNER_TEMP/mariam-notes.jks" \
            -storepass "$KEY_PASSWORD" -alias mariamnotes > /dev/null \
            || { echo "::error::KEYSTORE_BASE64 / KEY_PASSWORD do not open the signing key"; exit 1; }

      - run: flutter pub get
      - run: flutter analyze

      # Per-ABI APKs only, no universal one. The universal APK was 93 MB
      # (ONNX Runtime ships once per ABI) and its versionCode (the build
      # number) was lower than the split APKs' (1000 * ABI + build), so a
      # tablet that had a split APK installed refused it as a downgrade.
      # --target-platform does not help: it leaves the libraries of every ABI
      # in the APK. MariamsNotes.apk, the download link, is the arm64 build.
      - name: Build APKs
        run: |
          flutter build apk --release --split-per-abi
          mkdir dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/MariamsNotes.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/MariamsNotes-armeabi-v7a.apk

      - name: Check the APKs before publishing
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          bt="$(ls -d "$sdk"/build-tools/* | sort -V | tail -n 1)"
          for apk in dist/*.apk; do
            "$bt/apksigner" verify "$apk"
            "$bt/aapt2" dump badging "$apk" | grep -E "^package:|^native-code:" || true
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --target only matters when the tag does not exist yet (a manual
          # run): the tag is then created on the commit that was built.
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Mariam's Notes ${TAG#v}" \
            --generate-notes
